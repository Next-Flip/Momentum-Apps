concurrency:
  group: release-app-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FBT_GIT_SUBMODULE_SHALLOW: 1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "Resolve firmware preset"
        run: |
          case '${{ inputs.firmware }}' in
            momentum-dev)     R=Next-Flip/Momentum-Firmware;        F=dev ;;
            momentum-release) R=Next-Flip/Momentum-Firmware;        F=release ;;
            stock-dev)        R=flipperdevices/flipperzero-firmware; F=dev ;;
            stock-release)    R=flipperdevices/flipperzero-firmware; F=release ;;
            *) echo "Unknown firmware preset: ${{ inputs.firmware }}"; exit 1 ;;
          esac
          echo "FW_REPO=$R" >> $GITHUB_ENV
          echo "FW_REF=$F"  >> $GITHUB_ENV

      - name: "Checkout firmware"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FW_REPO }}
          ref: ${{ env.FW_REF }}
          fetch-depth: 1
          submodules: recursive

      - name: "Checkout apps"
        uses: actions/checkout@v4
        with:
          path: applications/external
          fetch-depth: 1

      - name: "Collect selected appids"
        run: |
          SLOTS=(
            '${{ inputs.app_1 }}'
            '${{ inputs.app_2 }}'
            '${{ inputs.app_3 }}'
            '${{ inputs.app_4 }}'
            '${{ inputs.app_5 }}'
            '${{ inputs.app_6 }}'
            '${{ inputs.app_7 }}'
            '${{ inputs.app_8 }}'
          )
          declare -A seen
          UNIQUE=()
          for slot in "${SLOTS[@]}"; do
            [ "$slot" = "(none)" ] && continue
            [ -z "$slot" ] && continue
            [ -n "${seen[$slot]:-}" ] && continue
            seen[$slot]=1
            UNIQUE+=("$slot")
          done
          if [ ${#UNIQUE[@]} -eq 0 ]; then
            echo "::error::No apps selected — all 8 slots are (none)."
            exit 1
          fi
          echo "RESOLVED_APPIDS=${UNIQUE[*]}" >> $GITHUB_ENV
          {
            echo "RESOLVED_APPIDS_MD<<EOF_APPIDS_MD"
            for a in "${UNIQUE[@]}"; do echo "- $a"; done
            echo "EOF_APPIDS_MD"
          } >> $GITHUB_ENV
          echo "Selected: ${UNIQUE[*]}"

      - name: "Resolve tag"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.tag }}'
          if [ "$TAG" = "new" ]; then
            DATE=$(date -u +%Y.%m.%d)
            N=$(gh api repos/${{ github.repository }}/releases --paginate \
                  -q '.[].tag_name' 2>/dev/null \
                | grep -c "^${DATE}-" || true)
            TAG="${DATE}-$((N+1))"
          fi
          echo "RESOLVED_TAG=$TAG" >> $GITHUB_ENV
          echo "Tag: $TAG"

      - name: "Build selected faps"
        run: |
          git add applications/external
          for APPID in $RESOLVED_APPIDS; do
            echo "::group::Building $APPID"
            ./fbt TARGET_HW=7 DEBUG=0 COMPACT=1 fap_${APPID}
            echo "::endgroup::"
          done

      - name: "Collect faps"
        run: |
          mkdir -p release-faps
          for APPID in $RESOLVED_APPIDS; do
            cp "build/f7-firmware-C/.extapps/${APPID}.fap" "release-faps/${APPID}.fap"
          done
          ls -la release-faps/

      - name: "Upload as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: faps-${{ github.run_number }}
          path: release-faps/*.fap
          if-no-files-found: error

      - name: "Publish release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_TAG }}
          name: "Apps build ${{ env.RESOLVED_TAG }}"
          files: release-faps/*.fap
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Built against `${{ env.FW_REPO }}@${{ env.FW_REF }}`.

            Included apps:
            ${{ env.RESOLVED_APPIDS_MD }}

      - name: "Refresh tag dropdown"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd applications/external
          gh api repos/${{ github.repository }}/releases --paginate \
              -q '.[].tag_name' \
            | python3 .github/scripts/update_tag_choices.py --keep 15
          if ! git diff --quiet .github/workflows/release-app.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/release-app.yml
            git commit -m "Refresh tag dropdown after ${{ env.RESOLVED_TAG }}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Tag dropdown already current."
          fi
