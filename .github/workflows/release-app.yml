      firmware:
        description: "Firmware to build against"
        type: choice
        required: true
        default: momentum-dev
        options:
          - momentum-dev
          - momentum-release
          - stock-dev
          - stock-release
      tag:
        description: "Release tag (`new` = auto YYYY.MM.DD-N; existing tag = update that release)"
        type: choice
        required: true
        default: new
        options:
          # >>> tags start
